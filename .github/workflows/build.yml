name: Build Kivy APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # needed to publish the GitHub Release below

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    - name: Cache Buildozer local directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}

    - name: Build APK with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1.2.0
      id: buildozer
      with:
        command: buildozer android debug
        buildozer_version: stable

    - name: Rename APK to a stable filename
      run: cp "${{ steps.buildozer.outputs.filename }}" PermutationApp-1.0-debug.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: PermutationApp-1.0-debug.apk

    # Publishes/overwrites a "latest" GitHub Release with the freshly built APK
    # attached, only on pushes to main (not on pull requests). This gives a
    # stable, permanent public URL:
    #   https://github.com/<owner>/<repo>/releases/latest/download/PermutationApp-1.0-debug.apk
    - name: Publish APK to GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: latest
        name: Latest build
        body: Automated debug build from the latest push to main. Not signed for production release.
        prerelease: true
        allowUpdates: true
        replacesArtifacts: true
        artifacts: PermutationApp-1.0-debug.apk